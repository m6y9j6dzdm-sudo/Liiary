<script>
  // Captura qualquer erro (de rede, script bloqueado, ou JS) e mostra na
  // tela em vez de deixar a página travada em "Carregando" sem explicação.
  function showFatalError(title, detail) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML =
      '<div style="max-width:680px;margin:40px auto;padding:20px;font-family:monospace;' +
      'background:#FFF5F5;border:1px solid #E39A9A;border-radius:12px;color:#5B2020;white-space:pre-wrap;">' +
      '<strong>Erro ao carregar o Liary</strong><br/><br/>' +
      (title || "") + "<br/><br/>" +
      (detail || "") +
      "</div>";
  }
  window.addEventListener("error", function (e) {
    showFatalError(
      "Falha de script: " + (e.message || "erro desconhecido"),
      (e.filename ? "Arquivo: " + e.filename + (e.lineno ? " (linha " + e.lineno + ")" : "") : "") +
        (e.error && e.error.stack ? "\n\n" + e.error.stack : "")
    );
  });
  window.addEventListener("unhandledrejection", function (e) {
    showFatalError(
      "Promessa rejeitada sem tratamento",
      (e.reason && e.reason.stack) || String(e.reason)
    );
  });
  // Se depois de 8s o React ainda não montou nada, avisa que provavelmente
  // um dos scripts externos (React/Babel) não carregou.
  window.__liaryMounted = false;
  setTimeout(function () {
    if (!window.__liaryMounted) {
      showFatalError(
        "O aplicativo não terminou de carregar em 15 segundos.",
        "Provável causa: um dos scripts externos (React, ReactDOM ou Babel, vindos do unpkg.com) não " +
          "carregou — verifique sua conexão ou se algum bloqueador de anúncios/rastreadores está " +
          "impedindo scripts de sites externos (unpkg.com) de carregar nesta página."
      );
    }
  }, 15000);
</script>

/* ---------------------------------------------------------------------
   PERSISTÊNCIA
   Todos os dados (peças, fornecedores, vendas, movimentações) ficam

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyXQ6RpNs78s99gMSiyIsjcO5OGJAN7vCTkC5epIk7FcTiNtUktOgkI9GA5NMDh2dS/exec";

// Fornecedores têm um campo "faixas" que é uma lista — precisa virar
// texto para caber numa célula da planilha, e voltar a ser lista ao ler.
function serializeSupplier(s) {
  return { ...s, faixas: JSON.stringify(s.faixas || []) };
}
function deserializeSupplier(row) {
  let faixas = [];
  try {
    faixas = typeof row.faixas === "string" ? JSON.parse(row.faixas) : row.faixas || [];
  } catch {
    faixas = [];
  }
  return { ...row, faixas };
}

async function loadData() {
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?sheet=all`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Falha ao ler a planilha");
    return {
      data: {
        products: json.data.produtos || [],
        suppliers: (json.data.fornecedores || []).map(deserializeSupplier),
        sales: json.data.vendas || [],
        movements: json.data.movimentacoes || [],
      },
      available: true,
    };
  } catch (e) {
    console.error("Falha ao carregar dados da planilha:", e);
    return { data: null, available: false };
  }
}

// Grava a lista inteira de uma aba de uma vez (mais simples e confiável
// do que sincronizar linha a linha). Usa text/plain para evitar bloqueio
// de CORS pelo Apps Script.
async function replaceSheet(sheet, records) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ sheet, action: "replaceAll", records }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || `Falha ao salvar ${sheet}`);
  return json.data;
}

async function saveData({ products, suppliers, sales, movements }) {
  try {
    await Promise.all([
      replaceSheet("produtos", products),
      replaceSheet("fornecedores", suppliers.map(serializeSupplier)),
      replaceSheet("vendas", sales),
      replaceSheet("movimentacoes", movements),
    ]);
    return true;
  } catch (e) {
    console.error("Falha ao salvar dados na planilha:", e);
    return false;
  }
}

/* ---------------------------------------------------------------------
   COMMISSION LOGIC
   Regra: a faixa é definida pelo TOTAL vendido do fornecedor no período,
   e o percentual daquela faixa incide sobre o total (não é progressivo
   por faixa, e sim "qual faixa o total atingiu"). Isso é o que a regra
   descrita ("até R$300: 25%; de R$300 a R$1.500: 35%; acima: 45%") indica
   de forma mais natural — deixei uma nota sobre essa escolha no rodapé
   da aba Fornecedores, e a estrutura é editável a qualquer momento.
--------------------------------------------------------------------- */

function faixaAtingida(total, faixas) {
  const ordenadas = [...faixas].sort((a, b) => (a.ate ?? Infinity) - (b.ate ?? Infinity));
  for (const f of ordenadas) {
    if (f.ate === null || total <= f.ate) return f;
  }
  return ordenadas[ordenadas.length - 1];
}

function calcComissao(total, faixas) {
  if (!faixas?.length || total <= 0) return { percentual: 0, comissao: 0, repasse: 0, faixa: null };
  const faixa = faixaAtingida(total, faixas);
  const percentual = faixa?.percentual || 0;
  const comissao = total * (percentual / 100);
  return { percentual, comissao, repasse: total - comissao, faixa };
}

function TicketCard({ p, supplierName, onEdit, onSell, onReturn }) {
  const statusTone = p.status === "disponivel" ? "ok" : p.status === "vendida" ? "plum" : "warn";
  const statusLabel = p.status === "disponivel" ? "Disponível" : p.status === "vendida" ? "Vendida" : "Devolvida";
  const low = p.status === "disponivel" && p.quantidade <= 1;
  const materialLabel = {
    banhado_ouro: "Banhado a ouro",
    banhado_prata: "Banhado a prata",
    prata_925: "Prata 925",
    bijuteria: "Bijuteria",
  }[p.material];

  return (
    <div className="relative bg-card border border-border rounded-xl overflow-hidden group">
      <div className="absolute -left-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-paper border border-border" />
      <div className="absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-paper border border-border" />
      <div className="flex">
        <div className="w-24 h-24 sm:w-28 sm:h-28 shrink-0 bg-sand flex items-center justify-center overflow-hidden">
          {p.foto ? (
            <img src={p.foto} alt={p.descricao} className="w-full h-full object-cover" />
          ) : (
            <Gem size={26} strokeWidth={1.3} className="text-mutedlighter" />
          )}

        <div className="flex-1 min-w-0 p-3 flex flex-col gap-1.5 border-l border-dashed border-border">
          <div className="flex items-start justify-between gap-2">
            <div className="min-w-0">
              <p className="text-sm font-medium text-ink leading-snug line-clamp-2">{p.descricao}</p>
              {(p.categoria || p.subcategoria) && (
                <p className="text-11 text-muted truncate">
                  {[p.categoria, p.subcategoria].filter(Boolean).join(" · ")}
                </p>
              )}
            </div>
            <button onClick={() => onEdit(p)} className="text-mutedlight hover-text-copper2 shrink-0 p-0.5">
              <Pencil size={14} />
            </button>
          </div>
          <div className="flex flex-wrap items-center gap-1.5">
            <Tag tone={statusTone}>{statusLabel}</Tag>
            <Tag tone={p.origem === "consignado" ? "copper" : "neutral"}>
              {p.origem === "consignado" ? "Consignado" : "Próprio"}
            </Tag>
            {materialLabel && <Tag tone="plum">{materialLabel}</Tag>}
            {low && <Tag tone="danger">Estoque baixo</Tag>}
          </div>

            <div className="font-mono text-11 text-muted" style={{ fontFamily: "IBM Plex Mono, monospace" }}>

          )}

            <div className="flex gap-2 pt-1.5">

function SemijoiasERP() {
  const [tab, setTab] = useState("dashboard");
  const [products, setProducts] = useState(seedProducts);
  const [suppliers, setSuppliers] = useState(seedSuppliers);
  const [sales, setSales] = useState([]);
  const [movements, setMovements] = useState([]);

  const [productModal, setProductModal] = useState(null); // {} new | product | null
  const [sellModal, setSellModal] = useState(null); // product
  const [supplierModal, setSupplierModal] = useState(null);
  const [search, setSearch] = useState("");
  const [filterOrigem, setFilterOrigem] = useState("todos");
  const [filterStatus, setFilterStatus] = useState("todos");
  const [view, setView] = useState("grid");

  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved | error | unavailable
  const isFirstSave = useRef(true);

  // Carrega os dados salvos assim que o app abre
  useEffect(() => {
    let active = true;
    loadData().then(({ data, available }) => {
      if (!active) return;
      if (data) {
        setProducts(data.products || []);
        setSuppliers(data.suppliers || []);
        setSales(data.sales || []);
        setMovements(data.movements || []);
      }
      if (!available) setSaveState("unavailable");
      setLoaded(true);
    });
    return () => {
      active = false;
    };
  }, []);

  // Salva automaticamente sempre que algo muda (só depois de carregar,
  // para não sobrescrever dados salvos com o estado inicial em branco)
  useEffect(() => {
    if (!loaded || saveState === "unavailable") return;
    if (isFirstSave.current) {
      // não salva imediatamente após o carregamento inicial, só em mudanças reais
      isFirstSave.current = false;
      return;
    }
    setSaveState("saving");
    const t = setTimeout(() => {
      saveData({ products, suppliers, sales, movements }).then((ok) => {
        setSaveState(ok ? "saved" : "error");
      });
    }, 400);
    return () => clearTimeout(t);
  }, [products, suppliers, sales, movements, loaded]);

  const supplierById = (id) => suppliers.find((s) => s.id === id);

  /* ---------------- derived data ---------------- */

  const filteredProducts = useMemo(() => {
    return products.filter((p) => {
      if (filterOrigem !== "todos" && p.origem !== filterOrigem) return false;
      if (filterStatus !== "todos" && p.status !== filterStatus) return false;
      if (search.trim()) {
        const q = search.toLowerCase();
        const hay = `${p.descricao} ${p.codigoFornecedor} ${p.codigoInterno} ${p.categoria} ${p.subcategoria || ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [products, filterOrigem, filterStatus, search]);

  const stats = useMemo(() => {
    const emEstoque = products.filter((p) => p.status === "disponivel");
    const consignadas = emEstoque.filter((p) => p.origem === "consignado").reduce((a, p) => a + p.quantidade, 0);
    const proprias = emEstoque.filter((p) => p.origem === "proprio").reduce((a, p) => a + p.quantidade, 0);
    const totalPecas = emEstoque.reduce((a, p) => a + p.quantidade, 0);
    const totalVendido = sales.reduce((a, s) => a + s.valor, 0);
    const baixo = emEstoque.filter((p) => p.quantidade <= 1);

    let comissoesReceber = 0;
    let repassarFornecedores = 0;
    suppliers.forEach((s) => {
      const totalForn = sales.filter((v) => v.fornecedorId === s.id).reduce((a, v) => a + v.valor, 0);
      const { comissao, repasse } = calcComissao(totalForn, s.faixas);
      comissoesReceber += comissao;
      repassarFornecedores += repasse;
    });

    const lucroProprio = sales
      .filter((s) => s.origem === "proprio")
      .reduce((a, s) => {
        const prod = products.find((p) => p.id === s.productId);
        return a + (s.valor - (prod?.valorPeca || 0));
      }, 0);

    return { totalPecas, consignadas, proprias, totalVendido, comissoesReceber, repassarFornecedores, lucroProprio, baixo };
  }, [products, sales, suppliers]);

  const supplierSummaries = useMemo(() => {
    return suppliers.map((s) => {
      const vendasForn = sales.filter((v) => v.fornecedorId === s.id);
      const total = vendasForn.reduce((a, v) => a + v.valor, 0);
      const { percentual, comissao, repasse, faixa } = calcComissao(total, s.faixas);
      return { supplier: s, total, percentual, comissao, repasse, faixa, nVendas: vendasForn.length };
    });
  }, [suppliers, sales]);

  /* ---------------- actions ---------------- */

  function addMovement(productId, tipo, detalhe) {
    setMovements((m) => [{ id: uid(), productId, tipo, data: todayISO(), detalhe }, ...m]);
  }

  function saveProduct(data) {
    if (data.id) {
      setProducts((ps) => ps.map((p) => (p.id === data.id ? data : p)));
    } else {
      const novo = { ...data, id: uid() };
      setProducts((ps) => [novo, ...ps]);
      addMovement(novo.id, "entrada", `Entrada · ${novo.quantidade} un. cadastrada${novo.quantidade > 1 ? "s" : ""}`);
    }
    setProductModal(null);
  }

  function deleteProduct(id) {
    setProducts((ps) => ps.filter((p) => p.id !== id));
    setProductModal(null);
  }

  function registerSale({ product, cliente, valor, formaPagamento, quantidade }) {
    const qtd = Math.max(1, Math.min(quantidade, product.quantidade));
    const novaQtd = product.quantidade - qtd;
    setProducts((ps) =>
      ps.map((p) =>
        p.id === product.id
          ? { ...p, quantidade: novaQtd, status: novaQtd <= 0 ? "vendida" : "disponivel" }
          : p
      )
    );
    setSales((sl) => [
      {
        id: uid(),
        productId: product.id,
        data: todayISO(),
        cliente: cliente || "Não informado",
        valor: Number(valor),
        formaPagamento,
        origem: product.origem,
        fornecedorId: product.fornecedorId || "",
        quantidade: qtd,
      },
      ...sl,
    ]);
    addMovement(product.id, "venda", `Venda · ${qtd} un. · ${brl(valor)} · ${formaPagamento}`);
    setSellModal(null);
  }

  function returnProduct(product) {
    setProducts((ps) => ps.map((p) => (p.id === product.id ? { ...p, status: "devolvida" } : p)));
    addMovement(product.id, "devolucao", `Devolução ao fornecedor · ${product.quantidade} un.`);
  }

  function saveSupplier(data) {
    if (data.id) {
      setSuppliers((ss) => ss.map((s) => (s.id === data.id ? data : s)));
    } else {
      setSuppliers((ss) => [...ss, { ...data, id: uid() }]);
    }

function ProductModal({ initial, suppliers, onClose, onSave, onDelete }) {
  const isEdit = !!initial?.id;
  const [form, setForm] = useState({
    id: initial?.id || null,
    codigoFornecedor: initial?.codigoFornecedor || "",
    codigoInterno: initial?.codigoInterno || "",
    descricao: initial?.descricao || "",
    categoria: initial?.categoria || "",
    subcategoria: initial?.subcategoria || "",
    material: initial?.material || "",
    foto: initial?.foto || "",
    quantidade: initial?.quantidade ?? 1,
    valorPeca: initial?.valorPeca ?? "",
    valorVenda: initial?.valorVenda ?? "",
    fornecedorId: initial?.fornecedorId || "",
    origem: initial?.origem || "consignado",
    dataEntrada: initial?.dataEntrada || todayISO(),
    status: initial?.status || "disponivel",
  });
  const fileRef = useRef();

  function handlePhoto(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setForm((f) => ({ ...f, foto: reader.result }));
    reader.readAsDataURL(file);
  }

  function submit(e) {
    e.preventDefault();
    if (!form.descricao.trim()) return;
    onSave({
      ...form,
      quantidade: Number(form.quantidade) || 0,
      valorPeca: Number(form.valorPeca) || 0,
      valorVenda: Number(form.valorVenda) || 0,
      fornecedorId: form.origem === "consignado" ? form.fornecedorId : "",
    });
  }

  return (
    <Modal title={isEdit ? "Editar peça" : "Nova peça"} onClose={onClose} wide>
      <form onSubmit={submit} className="flex flex-col gap-4">
        <div className="flex items-center gap-4">
          <div
            onClick={() => fileRef.current?.click()}
            className="w-20 h-20 rounded-xl bg-sand border border-dashed border-borderlight flex items-center justify-center overflow-hidden cursor-pointer shrink-0"
          >
            {form.foto ? <img src={form.foto} className="w-full h-full object-cover" alt="" /> : <Camera size={20} className="text-mutedlight" />}
          </div>
          <div className="text-xs text-muted">
            <button type="button" onClick={() => fileRef.current?.click()} className="text-copper2 font-medium hover:underline">
              Adicionar foto
            </button>
            <input ref={fileRef} type="file" accept="image/*" onChange={handlePhoto} className="hidden" />
            <p className="mt-0.5">JPG ou PNG, opcional.</p>
          </div>
        </div>

        <Field label="Descrição">
          <input required className={inputCls} value={form.descricao} onChange={(e) => setForm({ ...form, descricao: e.target.value })} placeholder="Ex.: Colar gargantilha banhado a ouro" />
        </Field>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Categoria">
            <input className={inputCls} value={form.categoria} onChange={(e) => setForm({ ...form, categoria: e.target.value })} placeholder="Colares, anéis…" />
          </Field>
          <Field label="Subcategoria">
            <input className={inputCls} value={form.subcategoria} onChange={(e) => setForm({ ...form, subcategoria: e.target.value })} placeholder="Gargantilha, riviera…" />
          </Field>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Material">
            <select className={inputCls} value={form.material} onChange={(e) => setForm({ ...form, material: e.target.value })}>
              <option value="">Selecionar…</option>
              <option value="banhado_ouro">Banhado a ouro</option>
              <option value="banhado_prata">Banhado a prata</option>
              <option value="prata_925">Prata 925</option>
              <option value="bijuteria">Bijuteria</option>
            </select>
          </Field>
          <Field label="Origem">
            <select className={inputCls} value={form.origem} onChange={(e) => setForm({ ...form, origem: e.target.value })}>
              <option value="consignado">Consignado</option>
              <option value="proprio">Estoque próprio</option>
            </select>
          </Field>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Código do fornecedor">
            <input className={`${inputCls} font-mono`} value={form.codigoFornecedor} onChange={(e) => setForm({ ...form, codigoFornecedor: e.target.value })} />
          </Field>
          <Field label="Código interno (opcional)">
            <input className={`${inputCls} font-mono`} value={form.codigoInterno} onChange={(e) => setForm({ ...form, codigoInterno: e.target.value })} />
          </Field>
        </div>

        {form.origem === "consignado" && (
          <Field label="Fornecedor">
            <select className={inputCls} value={form.fornecedorId} onChange={(e) => setForm({ ...form, fornecedorId: e.target.value })}>
              <option value="">Selecionar…</option>
              {suppliers.map((s) => (
                <option key={s.id} value={s.id}>{s.nome}</option>
              ))}
            </select>
          </Field>
        )}

        <div className="grid grid-cols-3 gap-3">
          <Field label="Quantidade">
            <input type="number" min="0" className={inputCls} value={form.quantidade} onChange={(e) => setForm({ ...form, quantidade: e.target.value })} />
          </Field>
          <Field label={form.origem === "consignado" ? "Valor da peça" : "Custo (peça)"}>
            <input type="number" step="0.01" min="0" className={inputCls} value={form.valorPeca} onChange={(e) => setForm({ ...form, valorPeca: e.target.value })} />
          </Field>
          <Field label="Valor de venda">
            <input type="number" step="0.01" min="0" className={inputCls} value={form.valorVenda} onChange={(e) => setForm({ ...form, valorVenda: e.target.value })} />
          </Field>
        </div>

        {form.origem === "proprio" && form.valorPeca !== "" && form.valorVenda !== "" && (
          <div className="text-xs bg-mint text-green rounded-lg px-3 py-2">
            Margem estimada por peça: <strong>{brl((Number(form.valorVenda) || 0) - (Number(form.valorPeca) || 0))}</strong>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Data de entrada">
            <input type="date" className={inputCls} value={form.dataEntrada} onChange={(e) => setForm({ ...form, dataEntrada: e.target.value })} />
          </Field>

            <select className={inputCls} value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>

              <option value="vendida">Vendida</option>
              <option value="devolvida">Devolvida</option>
            </select>
          </Field>
        </div>

        <div className="flex items-center justify-between pt-2 border-t border-border mt-1">
          {isEdit ? (
            <button
              type="button"
              onClick={() => onDelete(form.id)}
              className="flex items-center gap-1.5 text-sm text-red font-medium hover:underline"
            >
              <Trash2 size={14} /> Excluir peça
            </button>
          ) : <span />}
          <div className="flex gap-2">
            <button type="button" onClick={onClose} className="text-sm font-medium px-4 py-2 rounded-lg border border-borderlight text-brown">
              Cancelar
            </button>
            <button type="submit" className="text-sm font-semibold px-4 py-2 rounded-lg bg-ink text-cream hover-bg-ink-hover">
              Salvar
            </button>
          </div>
        </div>
      </form>
    </Modal>
  );

/* ---------------------------------------------------------------------

--------------------------------------------------------------------- */

function SupplierModal({ initial, onClose, onSave }) {
  const isEdit = !!initial?.id;
  const [nome, setNome] = useState(initial?.nome || "");
  const [faixas, setFaixas] = useState(
    initial?.faixas?.length ? initial.faixas : [{ ate: 300, percentual: 25 }, { ate: null, percentual: 35 }]
  );

  function updateFaixa(i, key, value) {
    setFaixas((fs) => fs.map((f, idx) => (idx === i ? { ...f, [key]: value } : f)));
  }
  function addFaixa() {
    setFaixas((fs) => {
      const withoutOpen = fs.map((f) => f);
      const last = withoutOpen[withoutOpen.length - 1];
      const novoLimite = (last?.ate ?? 0) + 500;
      return [...withoutOpen.slice(0, -1), { ate: novoLimite, percentual: last?.percentual ?? 30 }, { ate: null, percentual: (last?.percentual ?? 30) + 10 }];
    });
  }
  function removeFaixa(i) {
    setFaixas((fs) => (fs.length <= 1 ? fs : fs.filter((_, idx) => idx !== i)));
  }

  function submit(e) {
    e.preventDefault();
    if (!nome.trim()) return;
    onSave({ id: initial?.id, nome, tipo: "consignado", faixas: faixas.map((f) => ({ ate: f.ate === null ? null : Number(f.ate), percentual: Number(f.percentual) })) });
  }

  return (
    <Modal title={isEdit ? "Editar fornecedor" : "Novo fornecedor"} onClose={onClose}>
      <form onSubmit={submit} className="flex flex-col gap-4">
        <Field label="Nome do fornecedor">
          <input required className={inputCls} value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Ex.: Bruna Acessórios" />
        </Field>

        <div>
          <div className="flex items-center justify-between mb-2">
            <span className="text-11 uppercase tracking-wider text-muted font-semibold">Faixas de comissão</span>
            <button type="button" onClick={addFaixa} className="text-xs text-copper2 font-medium flex items-center gap-1 hover:underline">
              <Plus size={13} /> adicionar faixa
            </button>
          </div>
          <div className="flex flex-col gap-2">
            {faixas.map((f, i) => (
              <div key={i} className="faixa-row bg-paper-70 rounded-lg p-2.5">
                <span className="text-xs text-muted faixa-label">Até</span>
                {f.ate === null ? (
                  <span className="text-sm text-muted faixa-ate-vazia">valor acima da faixa anterior</span>
                ) : (
                  <input
                    type="number"
                    min="0"
                    className={`${inputCls} py-1.5 faixa-input-ate`}
                    value={f.ate}
                    onChange={(e) => updateFaixa(i, "ate", e.target.value)}
                  />
                )}
                <input
                  type="number"
                  min="0"
                  max="100"
                  className={`${inputCls} py-1.5 faixa-input-pct`}
                  value={f.percentual}
                  onChange={(e) => updateFaixa(i, "percentual", e.target.value)}
                />
                <span className="text-xs text-muted faixa-pct-sign">%</span>
                {faixas.length > 1 && (
                  <button type="button" onClick={() => removeFaixa(i)} className="text-mutedlight hover-text-red p-1 faixa-remove">
                    <X size={14} />
                  </button>
                )}
              </div>
            ))}
          </div>
          <p className="text-11 text-muted" style={{ marginTop: 8 }}>Ex.: até R$ 300,00 → 25%. A última faixa não tem limite e vale para qualquer valor acima da anterior.</p>
        </div>

        <div className="flex justify-end gap-2 pt-2 border-t border-border">
          <button type="button" onClick={onClose} className="text-sm font-medium px-4 py-2 rounded-lg border border-borderlight text-brown">
            Cancelar
          </button>

  );
}

  (function () {
